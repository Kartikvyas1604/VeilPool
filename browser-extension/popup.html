<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeilPool Extension</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0B0C15;
      --card-bg: rgba(255, 255, 255, 0.05);
      --primary: #9945FF;
      --secondary: #14F195;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --danger: #FF4B4B;
      --success: #14F195;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      width: 380px;
      height: 600px;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 0% 0%, rgba(153, 69, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(20, 241, 149, 0.1) 0%, transparent 50%);
    }

    /* Header */
    .header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }

    .brand-name {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.5px;
    }

    .wallet-badge {
      background: var(--card-bg);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .wallet-badge:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .wallet-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-muted);
    }

    .wallet-dot.active {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    /* Main Content */
    .main {
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: calc(100% - 70px);
      position: relative;
    }

    /* Connection Ring */
    .connection-ring-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 20px 0 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .connection-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.05);
    }

    .connection-ring::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--primary);
      border-right-color: var(--secondary);
      transform: rotate(0deg);
      transition: transform 1s linear;
    }

    .connecting .connection-ring::before {
      animation: spin 2s linear infinite;
    }

    .connected .connection-ring::before {
      border-color: var(--success);
      box-shadow: 0 0 20px rgba(20, 241, 149, 0.3);
    }

    .power-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1a1c2e, #0f1016);
      border: none;
      cursor: pointer;
      position: relative;
      z-index: 2;
      box-shadow: 
        5px 5px 10px rgba(0,0,0,0.5),
        -5px -5px 10px rgba(255,255,255,0.05);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .power-btn:active {
      transform: scale(0.95);
    }

    .power-icon {
      width: 40px;
      height: 40px;
      margin-bottom: 8px;
      fill: var(--text-muted);
      transition: all 0.3s;
    }

    .connected .power-icon {
      fill: var(--success);
      filter: drop-shadow(0 0 5px var(--success));
    }

    .status-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-bottom: 20px;
      opacity: 0.5;
      pointer-events: none;
      transition: all 0.3s;
    }

    .connected ~ .stats-grid {
      opacity: 1;
      pointer-events: auto;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Node Info */
    .node-info {
      width: 100%;
      background: linear-gradient(90deg, rgba(153, 69, 255, 0.1), rgba(20, 241, 149, 0.1));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
    }

    .connected ~ .node-info {
      opacity: 1;
      transform: translateY(0);
    }

    .node-details {
      display: flex;
      flex-direction: column;
    }

    .node-name {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .node-location {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ai-badge {
      background: rgba(153, 69, 255, 0.2);
      color: var(--primary);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(153, 69, 255, 0.3);
    }

    /* Animations */
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Icons */
    .icon {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Footer */
    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }
    
    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      margin: 0 5px;
    }
    
    .footer a:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-icon">V</div>
      <span class="brand-name">VeilPool</span>
    </div>
    <div class="wallet-badge" id="connectWalletBtn">
      <div class="wallet-dot" id="walletDot"></div>
      <span id="walletAddress">Connect Wallet</span>
    </div>
  </div>

  <div class="main">
    <div class="connection-ring-container" id="connectionRing">
      <div class="connection-ring"></div>
      <button class="power-btn" id="connectBtn">
        <svg class="power-icon" viewBox="0 0 24 24">
          <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/>
        </svg>
        <span class="status-label" id="statusText">Connect</span>
      </button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          Latency
        </div>
        <div class="stat-value" id="nodeLatency">-- ms</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/></svg>
          Data Used
        </div>
        <div class="stat-value" id="dataUsed">0 MB</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">
          <svg class="icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
          Time
        </div>
        <div class="stat-value" id="timeConnected">00:00:00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
          Security
        </div>
        <div class="stat-value" id="nodeReputation">High</div>
      </div>
    </div>

    <div class="node-info" id="nodeInfoPanel">
      <div class="node-details">
        <div class="node-name" id="nodeInfo">Not Connected</div>
        <div class="node-location">
          <span id="nodeLocation">--</span>
        </div>
      </div>
      <div class="ai-badge">AI ROUTED</div>
    </div>
    
    <div class="footer">
      <a href="#" id="openDashboard">Dashboard</a> • 
      <a href="#" id="openSettings">Settings</a> • 
      <a href="https://veilpool.io" target="_blank">VeilPool.io</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
